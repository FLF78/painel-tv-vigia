name: vigia

on:
  schedule:
    - cron: '3,18,33,48 * * * *'   # checagem a cada 15 min (minutos fora do :00, que é o horário mais congestionado no GitHub)
    - cron: '0 10 * * *'     # resumo diário às 07:00 de Brasília
  workflow_dispatch:
    inputs:
      resumo:
        description: Mandar resumo no Telegram mesmo sem mudança
        type: boolean
        default: true

permissions:
  actions: write   # cache do estado entre execuções
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # O estado (ok/problema + quando foi o último ok) viaja num cache: a execução NUNCA termina como "falha",
      # então o GitHub não manda e-mail de "Run failed" a cada checagem — o aviso é só pelo Telegram.
      - name: Estado anterior (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: vigia-estado-${{ github.run_id }}
          restore-keys: vigia-estado-

      - name: Checar o Painel TV
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          MODO: ${{ (github.event.schedule == '0 10 * * *' || (github.event_name == 'workflow_dispatch' && inputs.resumo)) && 'resumo' || '' }}
        run: python3 vigia.py

      - name: Guardar estado (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: vigia-estado-${{ github.run_id }}
