name: vigia

on:
  schedule:
    - cron: '*/15 * * * *'   # checagem (o GitHub pode atrasar alguns minutos)
    - cron: '0 10 * * *'     # resumo diário às 07:00 de Brasília
  workflow_dispatch:
    inputs:
      resumo:
        description: Mandar resumo no Telegram mesmo sem mudança
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Estado anterior (conclusão da última execução)
        id: anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh run list -R "$GITHUB_REPOSITORY" --workflow vigia.yml --status completed --limit 40 --json conclusion,createdAt 2>/dev/null || echo '[]')
          ultimo=$(echo "$json" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["conclusion"] if r else "")')
          horas=$(echo "$json" | python3 -c '
          import json,sys,datetime
          r=json.load(sys.stdin)
          ok=[x for x in r if x["conclusion"]=="success"]
          if not r or not ok: print(0); raise SystemExit
          t=datetime.datetime.fromisoformat(ok[0]["createdAt"].replace("Z","+00:00"))
          print(round((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/3600, 2))')
          echo "estado=$ultimo" >> "$GITHUB_OUTPUT"
          echo "horas_desde_ok=$horas" >> "$GITHUB_OUTPUT"
          echo "anterior=$ultimo · horas desde o último ok=$horas"

      - name: Checar o Painel TV
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          ESTADO_ANTERIOR: ${{ steps.anterior.outputs.estado }}
          HORAS_DESDE_OK: ${{ steps.anterior.outputs.horas_desde_ok }}
          MODO: ${{ (github.event.schedule == '0 10 * * *' || (github.event_name == 'workflow_dispatch' && inputs.resumo)) && 'resumo' || '' }}
        run: python3 vigia.py
